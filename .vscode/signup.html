<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <section id="default-web-header">
        <div class="page-header">
            <h1 class="main-header">MPS</h1>
            <nav class="main-page-nav">
                <a href="#">HOME</a>
                <a href="#about">What We Do</a>
                <a href="#contact">Talk to Us</a>
                <a href="login.html">Sign In</a>
            </nav>
        </div>
    </section>

    <section id="sign-up">
        <h2>SIGN UP </h2>
        <fieldset>
            <legend>Write Your Full Name:</legend>
            <input type="text">
        </fieldset>
        <fieldset>
            <legend>Enter your email:</legend>
            <input type="email" placeholder="myname@gmail.com">
        </fieldset>
        <fieldset>
            <legend>Create a Password:</legend>
            <input type="password" minlength="8" required>
        </fieldset>
        <fieldset>
            <legend>Confirm Password:</legend>
            <input type="password" minlength="8" required>
        </fieldset><br>
        <div class="">
            <button type="submit">Submit</button>
        </div>
    </section>
</body>
</html>
