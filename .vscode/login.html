<body>
    <section id="default-web-header">
        <div class="page-header">
            <h1 class="main-header">MPS</h1>
            <nav class="main-page-nav">
                <a href="#">HOME</a>
                <a href="#about">What We Do</a>
                <a href="#contact">Talk to Us</a>
                <a href="login.html">Sign In</a>
            </nav>
        </div>
    </section>

    <section id="login-form">
        <form action="">
            <div class="">
                <label for="email">Email:</label>
                <input type="email" placeholder="myName@gmail.com" required>
            </div>
            <div class="">
                <label for="password">Password:</label>
                <input type="password" minlength="10" maxlength="12" required>
            </div>
            <div class="submit-btn">
                <button type="submit">Login</button>
            </div>
            <div class="sign-up-notifier">
                <p>Don't have an account? <a href="signup.html">Sign up</a></p>
            </div>
        </form>
    </section>
    
</body>
